# This is a Databricks asset bundle definition for mlops_end_to_end_project.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: mlops_end_to_end_project
  cluster_id: 1016-151351-vba716wg

artifacts:
  default:
    type: whl
    build: python -m build
    path: .

variables:
  root_path:
    description: root_path for the target
    default: /Shared/.bundle/${bundle.target}/${bundle.name}
  git_sha:
    description: git_sha
    default: abcd
  schedule_pause_status:
    description: schedule pause pause_status
    default: UNPAUSED

resources:
  jobs:
    mlops_end_to_end_project:
      name: mlops_end_to_end_project
      schedule:
        quartz_cron_expression: "0 0 6 ? * MON"
        timezone_id: "Europe/Amsterdam"
        pause_status: UNPAUSED
      tags:
        project_name: "mlops_end_to_end_project"
      job_clusters:
        - job_cluster_key: "mlops-end-to-end-cluster"
          new_cluster: 
            spark_version: "15.4.x-scala2.12"
            data_security_mode: "SINGLE_USER"
            node_type_id: "Standard_DS3_v2"
            driver_node_type_id: "Standard_DS3_v2"
            autoscale: 
              min_workers: 1
              max_workers: 1
        
      tasks:
        - task_key: "preprocessing"
          job_cluster_key: "mlops-end-to-end-cluster"
          spark_python_task:
            python_file: "scripts/preprocess.py"
            parameters: 
              - "--root_path"
              - ${var.root_path}
          libraries:
            - whl: ./dist/*.whl
        - task_key: "train"
          depends_on: 
            - task_key: "preprocessing"
          job_cluster_key: "mlops-end-to-end-cluster"
          spark_python_task:
            python_file: "scripts/train_model_with_fe.py"
            parameters: 
              - "--root_path"
              - ${var.root_path}
              - "--git_sha"
              - ${var.git_sha}
              - "--job_run_id"
              - "{{job.id}}"
          libraries:
            - whl: ./dist/*.whl
        - task_key: "deploy"
          depends_on:
            - task_key: "train"
          job_cluster_key: "mlops-end-to-end-cluster"
          spark_python_task: 
            python_file: "scripts/deploy_model.py"
            parameters: 
              - "--root_path"
              - ${var.root_path}
              - "--job_run_id"
              - "{{job.id}}"
              - "--git_sha"
              - ${var.git_sha}
          libraries:
            - whl: ./dist/*.whl

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-955835127093591.11.azuredatabricks.net
      root_path: /Workspace/Users/k.patyk@paulaschoice-eu.com/.bundle/${bundle.target}/${bundle.name}